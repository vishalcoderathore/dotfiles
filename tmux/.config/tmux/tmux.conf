# ─────────────────────────────────────────────────────────
#  General
# ─────────────────────────────────────────────────────────

# Change prefix from Ctrl+b to Ctrl+s (home row, no pinky stretch)
unbind C-b
set -g prefix C-s

# Enable mouse support (click to select panes/windows, scroll)
set -g mouse on

# Start window and pane numbering at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Remove delay after pressing Escape (important for Neovim)
set -sg escape-time 0

# Use 256 colours + true colour support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Vim-style keys in copy mode
set-window-option -g mode-keys vi

# ─────────────────────────────────────────────────────────
#  Key Bindings
# ─────────────────────────────────────────────────────────

# Reload config with prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes with | (vertical) and - (horizontal), open in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with prefix + h/j/k/l (Vim-style).
# Bare Ctrl+h/j/k/l also works and crosses into Neovim splits — see
# vim-tmux-navigator below.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Sesh: fuzzy-jump to a project (running sessions, zoxide dirs, sesh.toml
# configs) via fzf; attaches if a session exists, else creates one
bind s run-shell "sesh connect \"$(sesh list --icons --hide-duplicates | fzf-tmux -p 55%,60% --no-sort --ansi --preview 'sesh preview {}' --preview-window 'right:55%')\""

# Popup: regular terminal (in the current pane's dir) or an LLM Neovim question
bind a display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "~/.config/tmux/ask/ask.sh"

# ─────────────────────────────────────────────────────────
#  Plugins (TPM)
# ─────────────────────────────────────────────────────────

# With the config at an XDG path, TPM defaults its plugin directory to
# ~/.config/tmux/plugins/ — which stow symlinks straight back into this repo,
# so installing would dump ~7 MB of plugin checkouts into version control.
# Pin it to the non-XDG location where TPM itself already lives.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'        # sane defaults
set -g @plugin 'christoomey/vim-tmux-navigator'    # Ctrl+hjkl across tmux/nvim
set -g @plugin 'catppuccin/tmux#v2.1.3'            # Catppuccin Mocha theme
set -g @plugin 'tmux-plugins/tmux-resurrect'       # save/restore sessions manually
set -g @plugin 'tmux-plugins/tmux-continuum'       # auto-save sessions every 10 min

# ─────────────────────────────────────────────────────────
#  Catppuccin Theme
# ─────────────────────────────────────────────────────────

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Active window number in peach (orange) instead of the default mauve
set -g @catppuccin_window_current_number_color "#{@thm_peach}"

# Date/time format shown in status bar
set -g @catppuccin_date_time_text " %b %-d, %-I:%M%p"

# Host segment: "WSL" when running under WSL, otherwise the hostname
set -g @catppuccin_host_text " #(grep -qi microsoft /proc/sys/kernel/osrelease 2>/dev/null && echo WSL || hostname)"

# ─────────────────────────────────────────────────────────
#  Status Bar
# ─────────────────────────────────────────────────────────

set -g status-position top
set -g status-interval 5

# Left: session name
set -g status-left-length 60
set -g status-left "#{E:@catppuccin_status_session} "

# Right: zoomed indicator + IP + date/time + hostname
set -g status-right-length 120
set -g status-right "#{?window_zoomed_flag,#[fg=#{@thm_yellow}] [Z] ,}#[fg=#{@thm_green}] #(ip route get 1 2>/dev/null | awk '{print $7;exit}')  #{E:@catppuccin_status_date_time}#{E:@catppuccin_status_host}"

# ─────────────────────────────────────────────────────────
#  Panes
# ─────────────────────────────────────────────────────────

# Active border in green (lavender in copy mode, mauve when synchronized).
# Same shape as the plugin's default, only the plain-active colour changes.
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_green}}}"

# Heavy lines, and colour the whole shared divider (indicators off) so every
# tmux version draws it the same. From 3.6 the default paints only half of the
# divider in two-pane windows. Off also means no border arrows, which tmux puts
# against the pane label below and can't reposition.
set -g pane-border-lines heavy
set -g pane-border-indicators off

# Label on each pane's bottom border: index + folder. The active pane gets a
# green pill; the rest stay grey. (Catppuccin's own pane label can't tell
# active from inactive, so this replaces it.) Commas inside the conditional
# are escaped as #, so they don't end a branch.
set -g pane-border-status bottom
set -g pane-border-format "#{?pane_active,#[fg=#{@thm_crust}#,bg=#{@thm_green}#,bold],#[fg=#{@thm_fg}#,bg=#{@thm_surface_1}]} #{pane_index} #[default] #{?pane_active,#[fg=#{@thm_green}#,bold],#[fg=#{@thm_overlay_1}]}#{b:pane_current_path}"

# ─────────────────────────────────────────────────────────
#  tmux-resurrect
# ─────────────────────────────────────────────────────────

# Restore pane contents on resurrect
set -g @resurrect-capture-pane-contents 'on'

# ─────────────────────────────────────────────────────────
#  tmux-continuum
# ─────────────────────────────────────────────────────────

# Don't auto-restore on server start: resurrect ends a restore with
# switch-client to the last-attached saved session, which yanks a fresh
# `ts <name>` client out of its new session. Restore manually with prefix + C-r.
set -g @continuum-restore 'off'

# Save session every 10 minutes
set -g @continuum-save-interval '10'

# ─────────────────────────────────────────────────────────
#  Initialize TPM — must stay at the very bottom
# ─────────────────────────────────────────────────────────

run '~/.tmux/plugins/tpm/tpm'

# Catppuccin paints the status bar during plugin load, so this has to come
# after TPM to win: a transparent bar that inherits the terminal background.
set -g status-style bg=default
