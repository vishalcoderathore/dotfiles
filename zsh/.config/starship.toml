"$schema" = 'https://starship.rs/config-schema.json'

# Two lines: context on top with the project's language on the right,
# then a bare ❯ to type after.
#   vishal dotfiles <branch-icon> main ●●            <python-icon> 3.12 2s
#   ❯
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$nodejs\
$python\
$golang\
$rust\
$java\
$ruby\
$lua\
$bun\
$deno\
$dotnet\
$aws\
$cmd_duration
$character"""

add_newline = true
# Language version checks run the tool itself; dotnet is slow on a cold start.
command_timeout = 1000
palette = 'catppuccin_mocha'

[fill]
symbol = ' '

[username]
show_always = true
format = '[$user]($style) '
style_user = 'overlay1'
style_root = 'bold red'

[hostname]
ssh_only = true
format = '[@$hostname]($style) '
style = 'overlay1'

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold lavender'
truncation_length = 3
truncate_to_repo = true
read_only = ' 󰌾'

[git_branch]
format = '[$symbol$branch]($style) '
symbol = " "
style = 'mauve'

[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
style = 'peach'

# One symbol per kind of change, coloured by severity:
#   ! modified  + staged  » renamed  ✘ deleted  ? untracked  = conflict
#   ≡ stash  ⇡/⇣ ahead/behind the remote  ⇕ diverged
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = ''
staged = '[+](green)'
modified = '[!](yellow)'
renamed = '[»](blue)'
deleted = '[✘](red)'
untracked = '[?](overlay1)'
conflicted = '[=](red)'
stashed = '[≡](lavender)'
ahead = '[⇡${count}](teal)'
behind = '[⇣${count}](teal)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](red)'

# Languages only show in a real project (package.json, Cargo.toml, ...),
# not in any folder that happens to contain a stray .js or .py file.
[nodejs]
format = '[$symbol$version]($style) '
symbol = " "
style = 'green'
version_format = '${raw}'
detect_extensions = []

[python]
format = '[$symbol$version( \($virtualenv\))]($style) '
symbol = " "
style = 'yellow'
version_format = '${major}.${minor}'
detect_extensions = []

[golang]
format = '[$symbol$version]($style) '
symbol = " "
style = 'sapphire'
version_format = '${raw}'
detect_extensions = []
detect_folders = []

[rust]
format = '[$symbol$version]($style) '
symbol = "\U000F1617 "
style = 'peach'
version_format = '${raw}'
detect_extensions = []

[java]
format = '[$symbol$version]($style) '
symbol = " "
style = 'red'
version_format = '${raw}'
detect_extensions = ['gradle']

[ruby]
format = '[$symbol$version]($style) '
symbol = " "
style = 'red'
version_format = '${raw}'
detect_extensions = []

[lua]
format = '[$symbol$version]($style) '
symbol = " "
style = 'blue'
version_format = '${raw}'
detect_files = ['.lua-version', '.luarc.json', 'stylua.toml', '.stylua.toml']
detect_extensions = []
detect_folders = []

[bun]
format = '[$symbol$version]($style) '
symbol = " "
style = 'rosewater'
version_format = '${raw}'

[deno]
format = '[$symbol$version]($style) '
symbol = " "
style = 'green'
version_format = '${raw}'

[dotnet]
format = '[$symbol$version]($style) '
symbol = " "
style = 'mauve'
version_format = '${raw}'
detect_extensions = ['csproj', 'fsproj', 'xproj', 'sln', 'slnx']

# Only shows when a named profile is active (AWS_PROFILE / AWS_DEFAULT_PROFILE).
# The icon is literal text rather than $symbol so the group stays empty,
# and hidden, when you're on the unnamed default profile.
[aws]
format = '([ $profile]($style) )'
style = 'peach'

[cmd_duration]
min_time = 2_000
format = '[$duration]($style)'
style = 'overlay1'

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](green)'

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
mauve = '#cba6f7'
red = '#f38ba8'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
overlay1 = '#7f849c'
